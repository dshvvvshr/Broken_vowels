name: Python Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
      - 'pytest.ini'
      - '.coveragerc'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
      - 'pytest.ini'
      - '.coveragerc'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # Stop on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check for style issues
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: false
    
    - name: Check formatting with black
      run: |
        black --check .
      continue-on-error: false
    
    - name: Security scan with bandit
      run: |
        bandit -r . -ll --skip B404,B603 --exclude ./tests/,./venv/,./env/
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --cov=core_directive --cov=evaluator --cov=gateway --cov=ai_client --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=95
    
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
    
    - name: Upload coverage artifact
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
      continue-on-error: true
